<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanSpot — Live Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }

    header {
      background-color: #2e7d32;
      color: white;
      padding: 16px;
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header div.header-text { flex: 1; }

    #authorityToggle, #locateBtn {
      background-color: white;
      color: #2e7d32;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 8px;
    }

    #authorityToggle.active {
      background-color: #1b5e20;
      color: white;
    }

    #map { height: 85vh; width: 100%; position: relative; }

    #statsPanel {
      position: fixed;
      top: 100px;
      right: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      padding: 14px 18px;
      z-index: 1000;
      font-size: 14px;
      min-width: 160px;
    }

    #statsPanel h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #2e7d32;
    }

    #statsPanel div { margin-bottom: 4px; }

    #statsPanel .stat-red { color: #e53935; font-weight: bold; }
    #statsPanel .stat-yellow { color: #b8860b; font-weight: bold; }
    #statsPanel .stat-green { color: #2e7d32; font-weight: bold; }

    .report-form textarea { width: 180px; margin-bottom: 8px; }

    .report-form button, .resolve-btn {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .resolve-btn { margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <div class="header-text">
      <h1>CleanSpot</h1>
      <p>See it. Report it. Resolve it. (Click anywhere on the map to report)</p>
    </div>
    <button id="authorityToggle">Login as Authority</button>
    <button id="locateBtn">📍 Locate Me</button>
  </header>

  <div id="map"></div>

  <div id="statsPanel">
    <h3>CleanSpot Stats</h3>
    <div>Total reports: <span id="statTotal">-</span></div>
    <div>Resolved: <span id="statResolved">-</span></div>
    <div class="stat-red">Red hotspots: <span id="statRed">-</span></div>
    <div class="stat-yellow">Yellow areas: <span id="statYellow">-</span></div>
    <div class="stat-green">Green areas: <span id="statGreen">-</span></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_URL = 'http://localhost:3000';

    const CLOUDINARY_CLOUD_NAME = 'bbfwd8ul';
    const CLOUDINARY_UPLOAD_PRESET = 'gpw8xhja';

    const map = L.map('map').setView([26.8467, 80.9462], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // --- NEW: whether "authority mode" is currently on ---
    let isAuthority = false;

    // --- NEW: layer groups let us clear and redraw markers/circles cleanly ---
    const reportLayer = L.layerGroup().addTo(map);
    const statusLayer = L.layerGroup().addTo(map);

    async function uploadPhotoToCloudinary(file) {
      if (!file) return null;

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        { method: 'POST', body: formData }
      );

      const data = await response.json();
      return data.secure_url;
    }

    // --- NEW: mark a report as resolved, then redraw everything ---
    async function resolveReport(reportId) {
      try {
        await fetch(`${API_URL}/reports/${reportId}/resolve`, { method: 'PATCH' });
        refreshEverything();  // redraw markers + status so the change shows immediately
      } catch (error) {
        alert('Could not mark as resolved — is the backend server running?');
      }
    }

    function addReportMarker(report) {
      const photoHtml = report.photoUrl
        ? `<br><img src="${report.photoUrl}" style="width:150px; margin-top:6px; border-radius:4px;">`
        : '';

      const statusText = report.resolved
        ? `<br><strong style="color:#2e7d32;">Resolved</strong>`
        : '';

      // Only show the "Mark Resolved" button if authority mode is on AND it isn't resolved yet
      const resolveButtonHtml = (isAuthority && !report.resolved)
        ? `<br><button class="resolve-btn" onclick="resolveReport('${report._id}')">Mark Resolved</button>`
        : '';

      L.marker([report.lat, report.lng])
        .addTo(reportLayer)
        .bindPopup(`<strong>Report</strong><br>${report.description}${photoHtml}${statusText}${resolveButtonHtml}`);
    }

    async function loadExistingReports() {
      try {
        const response = await fetch(`${API_URL}/reports`);
        const reports = await response.json();
        reports.forEach(addReportMarker);
      } catch (error) {
        console.log('Could not load reports — is the backend server running?', error);
      }
    }

    // --- NEW: turns unresolved report count into a shade of red — more
    // reports piling up in one spot = darker red, simple and predictable.
    const SEVERITY_MAX_COUNT = 8;  // unresolved reports at which it hits the darkest shade

    function getRedShade(unresolvedCount) {
      const lightRed = { r: 255, g: 205, b: 210 };  // just crossed into RED (3 reports)
      const darkRed  = { r: 165, g: 20,  b: 20  };  // heavily reported, deep red

      const severity = Math.min(unresolvedCount / SEVERITY_MAX_COUNT, 1);

      const r = Math.round(lightRed.r + (darkRed.r - lightRed.r) * severity);
      const g = Math.round(lightRed.g + (darkRed.g - lightRed.g) * severity);
      const b = Math.round(lightRed.b + (darkRed.b - lightRed.b) * severity);

      return `rgb(${r}, ${g}, ${b})`;
    }

    async function loadAreaStatus() {
      try {
        const response = await fetch(`${API_URL}/status`);
        const areas = await response.json();

        areas.forEach((area) => {
          let color = '#fdd835';  // YELLOW default
          if (area.status === 'RED') color = getRedShade(area.unresolvedCount);
          if (area.status === 'GREEN') color = '#43a047';

          L.circle([area.lat, area.lng], {
            radius: 50,
            color: color,
            fillColor: color,
            fillOpacity: 0.25,
            interactive: false
          }).addTo(statusLayer);

          L.circleMarker([area.lat, area.lng], {
            radius: 6,
            color: color,
            fillColor: color,
            fillOpacity: 1
          })
            .addTo(statusLayer)
            .bindPopup(`<strong>${area.status}</strong><br>${area.count} report(s) in this area`);
        });
      } catch (error) {
        console.log('Could not load area status — is the backend server running?', error);
      }
    }

    // --- NEW: fetch reports + status, and update the stats panel numbers ---
    async function updateStatsPanel() {
      try {
        const [reportsRes, statusRes] = await Promise.all([
          fetch(`${API_URL}/reports`),
          fetch(`${API_URL}/status`)
        ]);

        const reports = await reportsRes.json();
        const areas = await statusRes.json();

        const totalReports = reports.length;
        const resolvedCount = reports.filter((r) => r.resolved).length;
        const redCount = areas.filter((a) => a.status === 'RED').length;
        const yellowCount = areas.filter((a) => a.status === 'YELLOW').length;
        const greenCount = areas.filter((a) => a.status === 'GREEN').length;

        document.getElementById('statTotal').textContent = totalReports;
        document.getElementById('statResolved').textContent = resolvedCount;
        document.getElementById('statRed').textContent = redCount;
        document.getElementById('statYellow').textContent = yellowCount;
        document.getElementById('statGreen').textContent = greenCount;
      } catch (error) {
        console.log('Could not update stats panel', error);
      }
    }

    // --- NEW: clears everything currently drawn, then reloads it fresh from the backend ---
    function refreshEverything() {
      reportLayer.clearLayers();
      statusLayer.clearLayers();
      loadExistingReports();
      loadAreaStatus();
      updateStatsPanel();
    }

    refreshEverything();  // initial load when the page opens

    // --- NEW: toggle authority mode on/off ---
    document.getElementById('authorityToggle').addEventListener('click', function () {
      isAuthority = !isAuthority;
      this.classList.toggle('active', isAuthority);
      this.textContent = isAuthority ? 'Authority Mode: ON' : 'Login as Authority';
      refreshEverything();  // redraw so Resolve buttons appear/disappear correctly
    });

    // --- NEW: ask the browser for the user's real GPS location, and center the map there ---
    document.getElementById('locateBtn').addEventListener('click', function () {
      if (!navigator.geolocation) {
        alert('Your browser does not support location access.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          map.setView([userLat, userLng], 16);  // 16 = fairly close zoom, good for street-level reporting
        },
        function (error) {
          alert('Could not get your location. Make sure location access is allowed for this site.');
        }
      );
    });

    map.on('click', function (e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      const formHtml = `
        <div class="report-form">
          <strong>New Report</strong><br><br>
          <textarea id="reportDesc" rows="3" placeholder="Describe the problem..."></textarea><br>
          <input type="file" id="reportPhoto" accept="image/*"><br><br>
          <button id="submitReportBtn">Submit Report</button>
        </div>
      `;

      const popup = L.popup()
        .setLatLng(e.latlng)
        .setContent(formHtml)
        .openOn(map);

      setTimeout(() => {
        document.getElementById('submitReportBtn').addEventListener('click', async function () {
          const description = document.getElementById('reportDesc').value || 'No description provided';
          const photoFile = document.getElementById('reportPhoto').files[0];

          try {
            const photoUrl = await uploadPhotoToCloudinary(photoFile);

            const response = await fetch(`${API_URL}/reports`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ description, lat, lng, photoUrl })
            });

            await response.json();
            map.closePopup();
            refreshEverything();  // redraw so the new report + updated status both show
          } catch (error) {
            alert('Could not save report — is the backend server running?');
          }
        });
      }, 100);
    });
  </script>

</body>
</html>
