<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanSpot — Live Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #2e7d32;
      color: white;
      padding: 16px;
      text-align: center;
    }

    #map {
      height: 85vh;
      width: 100%;
    }

    .report-form textarea {
      width: 180px;
      margin-bottom: 8px;
    }

    .report-form button {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>CleanSpot</h1>
    <p>See it. Report it. Resolve it. (Click anywhere on the map to report)</p>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Where our backend lives. We'll change this later when we host it online.
    const API_URL = 'http://localhost:3000';

    const map = L.map('map').setView([26.8467, 80.9462], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // --- NEW: a helper function that draws one marker on the map for a report ---
    function addReportMarker(report) {
      L.marker([report.lat, report.lng])
        .addTo(map)
        .bindPopup(`<strong>Report</strong><br>${report.description}`);
    }

    // --- NEW: on page load, ask the backend for every saved report, and draw them all ---
    async function loadExistingReports() {
      try {
        const response = await fetch(`${API_URL}/reports`);
        const reports = await response.json();
        reports.forEach(addReportMarker);
      } catch (error) {
        console.log('Could not load reports — is the backend server running?', error);
      }
    }

    // --- NEW: ask the backend for grouped area statuses, and draw a colored circle for each ---
    async function loadAreaStatus() {
      try {
        const response = await fetch(`${API_URL}/status`);
        const areas = await response.json();

        areas.forEach((area) => {
          // Pick a color based on the status the backend calculated
          const color = area.status === 'RED' ? '#e53935' : '#fdd835';

          L.circle([area.lat, area.lng], {
            radius: 50,         // matches GROUPING_RADIUS_METERS on the backend
            color: color,
            fillColor: color,
            fillOpacity: 0.25,
            interactive: false   // lets map clicks pass through the circle instead of being absorbed by it
          })
            .addTo(map);

          // A small clickable dot at the center, just to show status info without blocking the whole area
          L.circleMarker([area.lat, area.lng], {
            radius: 6,
            color: color,
            fillColor: color,
            fillOpacity: 1
          })
            .addTo(map)
            .bindPopup(`<strong>${area.status}</strong><br>${area.count} report(s) in this area`);
        });
      } catch (error) {
        console.log('Could not load area status — is the backend server running?', error);
      }
    }

    loadExistingReports();   // runs immediately when the page opens
    loadAreaStatus();        // runs immediately too, draws the colored zones

    // Click-to-report, same as before, but the submit button now saves for real
    map.on('click', function (e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      const formHtml = `
        <div class="report-form">
          <strong>New Report</strong><br><br>
          <textarea id="reportDesc" rows="3" placeholder="Describe the problem..."></textarea><br>
          <input type="file" id="reportPhoto" accept="image/*"><br><br>
          <button id="submitReportBtn">Submit Report</button>
        </div>
      `;

      const popup = L.popup()
        .setLatLng(e.latlng)
        .setContent(formHtml)
        .openOn(map);

      setTimeout(() => {
        document.getElementById('submitReportBtn').addEventListener('click', async function () {
          const description = document.getElementById('reportDesc').value || 'No description provided';

          // --- NEW: send this report to the backend instead of just drawing a marker locally ---
          try {
            const response = await fetch(`${API_URL}/reports`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ description, lat, lng })
            });

            const savedReport = await response.json();

            // Only draw the marker once the backend confirms it was saved
            addReportMarker(savedReport);
            map.closePopup();

            // Recalculate area status now that a new report exists
            loadAreaStatus();
          } catch (error) {
            alert('Could not save report — is the backend server running?');
          }
        });
      }, 100);
    });
  </script>

</body>
</html>
